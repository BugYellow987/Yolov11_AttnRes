# Ultralytics YOLO11 object detection model with CSAR feature fusion.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-CSAR.yaml' will call yolo11-CSAR.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11-CSAR backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, FSAttentionResiduals, [256, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, FSAttentionResiduals, [512, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, FSAttentionResiduals, [512]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, FSAttentionResiduals, [1024]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11-CSAR head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[6, -1], 1, CSAR, [512, 4, 0, 0.5, True]] # fuse P5-up with backbone P4, keep P4 as residual target
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[4, -1], 1, CSAR, [256, 4, 0, 0.5, True]] # fuse P4-up with backbone P3, keep P3 as residual target
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[13, -1], 1, CSAR, [512, 4, -1, 0.5, True]] # fuse P3-down with head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[10, -1], 1, CSAR, [1024, 4, -1, 0.5, True]] # fuse P4-down with backbone P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
  # - [[16, 19, 22], 1, Segment, [nc, 32, 256]]
