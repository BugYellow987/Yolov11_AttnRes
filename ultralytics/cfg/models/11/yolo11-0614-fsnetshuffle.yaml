#祥瑞提供的backbone架構套用，並讓FSNetShuffle和AttnRes分開
# Ultralytics YOLO11 object detection model with multi-input FSNetShuffle + AttentionResiduals backbone.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-0614-fsnetshuffle.yaml' will call yolo11-0614-fsnetshuffle.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11-FSNetShuffle backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4

  - [[0, 1], 1, FSNetShuffle, [128, 1, 2]] # 2-P2/4, S target P2
  - [-1, 2, AttentionResiduals, [256, 0.25]] # 3-P2/4

  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [[3, 4], 1, FSNetShuffle, [256, 1, 2]] # 5-P3/8, S target P3
  - [-1, 2, AttentionResiduals, [512, 0.25]] # 6-P3/8

  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [[3, 6, 7], 1, FSNetShuffle, [512, 2, 2]] # 8-P4/16, S target P4
  - [-1, 2, AttentionResiduals, [512]] # 9-P4/16

  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [[6, 9, 10], 1, FSNetShuffle, [1024, 2, 2]] # 11-P5/32, S target P5
  - [-1, 2, AttentionResiduals, [1024]] # 12-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 13
  - [-1, 2, C2PSA, [1024]] # 14

# YOLO11 detection head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 20 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 23 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 26 (P5/32-large)

  - [[20, 23, 26], 1, Detect, [nc]] # Detect(P3, P4, P5)
