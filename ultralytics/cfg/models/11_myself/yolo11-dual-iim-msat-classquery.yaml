# YOLO11 segmentation ablation V3: delayed RGB/IIM fusion, MSAT, and a class-query-conditioned head.
# Training requirement: overlap_mask=False.

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, DualIIMStem, [64, 3, 2, 8, 3]]           # 0: (RGB P1/2, IIM P1/2)
  - [0, 1, Index, [-1, 0]]                            # 1: RGB P1/2
  - [0, 1, Index, [-1, 1]]                            # 2: IIM P1/2
  - [1, 1, Conv, [128, 3, 2]]                        # 3: RGB P2/4
  - [2, 1, Conv, [128, 3, 2]]                        # 4: IIM P2/4
  - [[3, 4], 1, AdaptiveGatedFusion, [128, 4, 7, True]] # 5: gated P2/4
  - [5, 2, AttentionResiduals, [256, 0.25]]           # 6
  - [[5, 6], 1, FSNetShuffle, [128, 1, 2]]            # 7: fused P2/4
  - [3, 1, Conv, [256, 3, 2]]                        # 8: RGB P3/8
  - [4, 1, Conv, [256, 3, 2]]                        # 9: IIM P3/8
  - [[8, 9], 1, AdaptiveGatedFusion, [256, 4, 7, True]] # 10: gated P3/8
  - [10, 2, AttentionResiduals, [512, 0.25]]          # 11
  - [[10, 11], 1, FSNetShuffle, [256, 1, 2]]          # 12: fused P3/8
  - [12, 1, Conv, [512, 3, 2]]                       # 13: P4/16
  - [13, 2, AttentionResiduals, [512]]                # 14
  - [[13, 14], 1, FSNetShuffle, [512, 2, 2]]          # 15: fused P4/16
  - [15, 1, Conv, [1024, 3, 2]]                      # 16: P5/32
  - [16, 2, AttentionResiduals, [1024]]               # 17
  - [[16, 17], 1, FSNetShuffle, [1024, 2, 2]]         # 18
  - [18, 1, SPPF, [1024, 5]]                         # 19
  - [19, 2, C2PSA, [1024]]                           # 20: fused P5/32

head:
  - [[7, 12, 15, 20], 1, CSAR, [512, 4, 1, 0.5, True]]  # 21: stage-1 P3/8
  - [[7, 12, 15, 20], 1, CSAR, [512, 4, 2, 0.5, True]]  # 22: stage-1 P4/16
  - [[7, 12, 15, 20], 1, CSAR, [1024, 4, 3, 0.5, True]] # 23: stage-1 P5/32

  # Each MSATMultiLabel returns (fused feature, class-query logits).
  # Args: [c2, nc, heads, target, embed_channels(0=auto), FFN ratio, window size, shortcut].
  - [[7, 21, 22, 23], 1, MSATMultiLabel, [128, nc, 4, 0, 0, 2.0, 8, True]]  # 24: P2
  - [24, 1, Index, [-1, 0]]                                                    # 25: P2 fused
  - [24, 1, Index, [nc, 1]]                                                    # 26: P2 query logits
  - [[7, 21, 22, 23], 1, MSATMultiLabel, [256, nc, 4, 1, 0, 2.0, 8, True]]  # 27: P3
  - [27, 1, Index, [-1, 0]]                                                    # 28: P3 fused
  - [27, 1, Index, [nc, 1]]                                                    # 29: P3 query logits
  - [[7, 21, 22, 23], 1, MSATMultiLabel, [512, nc, 4, 2, 0, 2.0, 8, True]]  # 30: P4
  - [30, 1, Index, [-1, 0]]                                                    # 31: P4 fused
  - [30, 1, Index, [nc, 1]]                                                    # 32: P4 query logits
  - [[7, 21, 22, 23], 1, MSATMultiLabel, [1024, nc, 4, 3, 0, 2.0, 8, True]] # 33: P5
  - [33, 1, Index, [-1, 0]]                                                    # 34: P5 fused
  - [33, 1, Index, [nc, 1]]                                                    # 35: P5 query logits

  # Feature order is P3/P2/P4/P5, followed by matching query logits in the same order.
  # Args: [nc, masks, prototypes, multi-label gain, co-occurrence weight, conditioning scale].
  - [[28, 25, 31, 34, 29, 26, 32, 35], 1, Segment26ClassQuery, [nc, 32, 256, 0.5, 2.0, 0.1]] # 36
