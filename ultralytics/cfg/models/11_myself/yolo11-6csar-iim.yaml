# Ultralytics YOLO11 instance segmentation model with a YOLA IIM front-end and the 6-CSAR architecture.
# Based on yolo11-6csar.yaml. The layer count is unchanged so all CSAR and Segment26 indices remain stable.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11-FSNetShuffle backbone with an illumination-invariant front-end.
# IIMStem: RGB stem || YOLA IIM (8 shared zero-mean 3x3 kernels per RGB pair) -> Concat -> 1x1 Conv.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, IIMStem, [64, 3, 2, 8, 3]]        # 0-P1/2, dual RGB/IIM stem and 1x1 fusion
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4 (main P2 Conv)

  # P2 fusion
  - [-1, 2, AttentionResiduals, [256, 0.25]]    # 2-P2/4
  - [[1, 2], 1, FSNetShuffle, [128, 1, 2]]     # 3-P2/4

  # P3 fusion
  - [3, 1, Conv, [256, 3, 2]]                  # 4-P3/8
  - [4, 2, AttentionResiduals, [512, 0.25]]    # 5-P3/8
  - [[4, 5], 1, FSNetShuffle, [256, 1, 2]]     # 6-P3/8

  # P4 fusion
  - [6, 1, Conv, [512, 3, 2]]                  # 7-P4/16
  - [7, 2, AttentionResiduals, [512]]          # 8-P4/16
  - [[7, 8], 1, FSNetShuffle, [512, 2, 2]]     # 9-P4/16

  # P5 fusion
  - [9, 1, Conv, [1024, 3, 2]]                 # 10-P5/32
  - [10, 2, AttentionResiduals, [1024]]        # 11-P5/32
  - [[10, 11], 1, FSNetShuffle, [1024, 2, 2]] # 12-P5/32

  - [-1, 1, SPPF, [1024, 5]]                   # 13
  - [-1, 2, C2PSA, [1024]]                     # 14-P5/32

# Two-stage CSAR segmentation head inherited from yolo11-6csar.yaml.
head:
  - [[3, 6, 9, 14], 1, CSAR, [512, 4, 1, 0.5, True]]   # 15-P3/8
  - [[3, 6, 9, 14], 1, CSAR, [512, 4, 2, 0.5, True]]   # 16-P4/16
  - [[3, 6, 9, 14], 1, CSAR, [1024, 4, 3, 0.5, True]]  # 17-P5/32
  - [[3, 6, 9, 14], 1, CSAR, [1024, 4, 3, 0.5, True]]  # 18-P5/32
  - [[3, 6, 9, 14], 1, CSAR, [1024, 4, 3, 0.5, True]]  # 19-P5/32

  - [[15, 16, 17, 18, 19], 1, FSNetShuffle, [128, 0, 2]]  # 20-P2/4
  - [[15, 16, 17, 18, 19], 1, FSNetShuffle, [256, 1, 2]]  # 21-P3/8
  - [[15, 16, 17, 18, 19], 1, FSNetShuffle, [512, 2, 2]]  # 22-P4/16
  - [[15, 16, 17, 18, 19], 1, FSNetShuffle, [1024, 3, 2]] # 23-P5/32
  - [[15, 16, 17, 18, 19], 1, FSNetShuffle, [1024, 4, 2]] # 24-P6/64

  - [[20, 21, 22, 23, 24], 1, CSAR, [128, 4, 0, 0.5, True]]  # 25-P2/4
  - [[20, 21, 22, 23, 24], 1, CSAR, [256, 4, 1, 0.5, True]]  # 26-P3/8
  - [[20, 21, 22, 23, 24], 1, CSAR, [512, 4, 2, 0.5, True]]  # 27-P4/16
  - [[20, 21, 22, 23, 24], 1, CSAR, [1024, 4, 3, 0.5, True]] # 28-P5/32
  - [[20, 21, 22, 23, 24], 1, CSAR, [1024, 4, 4, 0.5, True]] # 29-P6/64

  - [[25, 26, 27, 28, 29], 1, Segment26, [nc, 32, 256]]  # 30-Segment26(P3, P4, P5)
