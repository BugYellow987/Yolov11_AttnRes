# Ultralytics YOLO11 instance segmentation model with a residual YOLA IIM front-end and P2-aware 6-CSAR architecture.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11-FSNetShuffle backbone with an illumination-invariant residual front-end.
# IIMStem: full-width RGB/luminance stem + gated YOLA IIM residual (8 shared zero-mean 3x3 kernels per RGB pair).
backbone:
  # [from, repeats, module, args]
  - [-1, 1, IIMStem, [64, 3, 2, 8, 3]]        # 0-P1/2, complete RGB main path + IIM residual
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4 (main P2 Conv)

  # P2 fusion
  - [-1, 2, AttentionResiduals, [256, 0.25]]    # 2-P2/4
  - [[1, 2], 1, FSNetShuffle, [128, 1, 2]]     # 3-P2/4

  # P3 fusion
  - [3, 1, Conv, [256, 3, 2]]                  # 4-P3/8
  - [4, 2, AttentionResiduals, [512, 0.25]]    # 5-P3/8
  - [[4, 5], 1, FSNetShuffle, [256, 1, 2]]     # 6-P3/8

  # P4 fusion
  - [6, 1, Conv, [512, 3, 2]]                  # 7-P4/16
  - [7, 2, AttentionResiduals, [512]]          # 8-P4/16
  - [[7, 8], 1, FSNetShuffle, [512, 2, 2]]     # 9-P4/16

  # P5 fusion
  - [9, 1, Conv, [1024, 3, 2]]                 # 10-P5/32
  - [10, 2, AttentionResiduals, [1024]]        # 11-P5/32
  - [[10, 11], 1, FSNetShuffle, [1024, 2, 2]] # 12-P5/32

  - [-1, 1, SPPF, [1024, 5]]                   # 13
  - [-1, 2, C2PSA, [1024]]                     # 14-P5/32

# Two-stage CSAR segmentation head inherited from yolo11-6csar.yaml.
head:
  - [[3, 6, 9, 14], 1, CSAR, [512, 4, 1, 0.5, True]]   # 15-P3/8
  - [[3, 6, 9, 14], 1, CSAR, [512, 4, 2, 0.5, True]]   # 16-P4/16
  - [[3, 6, 9, 14], 1, CSAR, [1024, 4, 3, 0.5, True]]  # 17-P5/32

  - [[3, 15, 16, 17], 1, CSAR, [512, 4, 1, 0.5, True]]   # 18-P3/8
  - [[3, 15, 16, 17], 1, CSAR, [512, 4, 2, 0.5, True]]   # 19-P4/16
  - [[3, 15, 16, 17], 1, CSAR, [1024, 4, 3, 0.5, True]]  # 20-P5/32

  # P2 uses refined P3/P4 context to compare local dent shading against the larger-scale parallel rib structure.
  - [[3, 18, 19], 1, CSAR, [128, 4, 0, 0.5, True]]  # 21-P2/4, context-fused P2(P2, P3, P4)

  # Detection uses P2/P3/P4/P5; proto_index=1 keeps Proto26 on P3/P4/P5 at mask_ratio=4 resolution.
  - [[21, 18, 19, 20], 1, Segment26, [nc, 32, 256, 1]]  # 22-Segment26(P2, P3, P4, P5)
